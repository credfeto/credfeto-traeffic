# Requires CF_DNS_API_TOKEN environment variable for Cloudflare
certificatesResolvers:
  letsencrypt:
    acme:

      storage: /etc/traefik/acme/acme.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 0
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

providers:
  file:
    filename: "/etc/traefik/dynamic_conf.yml"
    watch: true
