services:
  config-gen:
    image: "alpine:latest"
    restart: "no"
    command: ["/bin/sh", "/generate-config.sh"]
    environment:
      - PHOTOS_LOCAL_SECRET=${PHOTOS_LOCAL_SECRET}
    volumes:
      - "./generate-config.sh:/generate-config.sh:ro"
      - "./dynamic_conf.yml.template:/templates/dynamic_conf.yml.template:ro"
      - "traefik-dynamic:/config"

  traefik:
    image: "traefik:v3.6.13"
    container_name: "traefik"
    restart: always
    depends_on:
      config-gen:
        condition: service_completed_successfully
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${CLOUDFLARE_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    ports:
      - "443:443/tcp"
      - "443:443/udp"
      - "444:444/tcp"
      - "444:444/udp"

      - "446:446/tcp"
      - "446:446/udp"
      - "447:447/tcp"
      - "447:447/udp"

      - "448:448/tcp"
      - "449:449/tcp"
      - "450:450/tcp"
      - "451:451/tcp"
      - "452:452/tcp"
      - "453:453/tcp"

      - "455:455/tcp"
      - "456:456/tcp"
    volumes:
      - "./traefik.yml:/etc/traefik/traefik.yml"
      - "traefik-dynamic:/etc/traefik-dynamic:ro"
      - "traefik-acme:/etc/traefik/acme"

  traefik-reject:
    image: "nginx:alpine"
    container_name: "traefik-reject"
    restart: always
    volumes:
      - "./nginx-reject.conf:/etc/nginx/conf.d/default.conf:ro"

  cloudflare:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare
    restart: always
    command: tunnel --no-autoupdate run --token $CLOUDFLARE_TUNNEL_TOKEN
    depends_on:
      traefik:
        condition: service_started

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    command: --interval 86400

volumes:
  traefik-acme:
    name: traefik-acme
    external: true
  traefik-dynamic:
