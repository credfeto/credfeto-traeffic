---
# Project-level pre-commit configuration.
# This overrides the global config for dotenv-linter fix (cs-template#777).
# See https://github.com/credfeto/cs-template/issues/777

default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: local
    hooks:
      # ── VALIDATE_ENV ──────────────────────────────────────────────────────
      - id: dotenv-linter
        name: dotenv-linter
        entry: dotenv-linter check
        language: system
        files: (^|/)\.env(\.[^/]+)?$
